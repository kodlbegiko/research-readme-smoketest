name: Issue 121 reference evaluation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/evaluate_issue_121.py"
      - "tests/test_issue121_reference.py"
      - "tests/test_issue121_pipeline.py"
      - ".github/workflows/reference-evaluation.yml"

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Check formatting and tests
        run: |
          ruff check scripts/evaluate_issue_121.py tests/test_issue121_reference.py \
            tests/test_issue121_pipeline.py
          ruff format --check scripts/evaluate_issue_121.py tests/test_issue121_reference.py \
            tests/test_issue121_pipeline.py
          pytest tests/test_issue121_reference.py tests/test_issue121_pipeline.py
      - name: Reproduce reference result outside the checkout
        run: |
          rm -rf /tmp/reference
          mkdir -p /tmp/reference/data/issue-121
          cp -R data/issue-121/raw /tmp/reference/data/issue-121/
          cp -R data/issue-121/predictions /tmp/reference/data/issue-121/
          python scripts/evaluate_issue_121.py \
            --data-dir /tmp/reference/data/issue-121 \
            --results-dir /tmp/reference/results
          diff -u \
            data/issue-121/annotations/reference-labels.json \
            /tmp/reference/data/issue-121/annotations/reference-labels.json
          diff -u \
            results/issue-121/static-validation-results.json \
            /tmp/reference/results/static-validation-results.json
      - name: Upload reproduced reference bundle
        uses: actions/upload-artifact@v4
        with:
          name: issue-121-reference-reproduction
          path: |
            /tmp/reference/data/issue-121/annotations/
            /tmp/reference/results/
          if-no-files-found: error
          retention-days: 30
