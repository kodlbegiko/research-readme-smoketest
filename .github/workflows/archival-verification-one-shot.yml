name: One-shot archival verification

on:
  push:
    branches:
      - agent/archival-verification-one-shot
    paths:
      - .github/workflows/archival-verification-one-shot.yml
  pull_request:
    paths:
      - .github/workflows/archival-verification-one-shot.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Verify annotated tag, Release, assets, and frozen checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p archival-output
          git fetch --force --tags origin

          tag_type="$(git cat-file -t research-closeout-issue-121)"
          tag_target="$(git rev-parse research-closeout-issue-121^{})"
          printf 'tag_type=%s\ntag_target=%s\n' "$tag_type" "$tag_target" \
            | tee archival-output/tag-verification.txt
          test "$tag_type" = "tag"
          test "$tag_target" = "4dfb0b961470974f9dc80a936db86450303d007a"

          gh api \
            repos/kodlbegiko/research-readme-smoketest/releases/tags/research-closeout-issue-121 \
            > archival-output/release.json

          python - <<'PY'
          import json
          from pathlib import Path

          release = json.loads(Path('archival-output/release.json').read_text())
          expected_assets = {
              'dynamic-validation-results.json',
              'dynamic-validation-results.csv',
              'intervention-log.json',
              'intervention-log.csv',
              'DYNAMIC-FINAL-SHA256SUMS',
              'research-manifest-issue-121.yml',
              'EXTERNAL-VALIDATION.md',
          }
          actual_assets = {asset['name'] for asset in release['assets']}
          summary = {
              'name': release['name'],
              'tag_name': release['tag_name'],
              'draft': release['draft'],
              'prerelease': release['prerelease'],
              'html_url': release['html_url'],
              'assets': sorted(actual_assets),
              'missing_assets': sorted(expected_assets - actual_assets),
              'unexpected_assets': sorted(actual_assets - expected_assets),
          }
          Path('archival-output/release-summary.json').write_text(
              json.dumps(summary, indent=2, ensure_ascii=False) + '\n'
          )
          assert release['name'] == 'Issue 121 External Validation — Negative Research Closeout'
          assert release['tag_name'] == 'research-closeout-issue-121'
          assert release['draft'] is False
          assert release['prerelease'] is False
          assert actual_assets == expected_assets, summary
          PY

          git checkout --detach research-closeout-issue-121
          sha256sum -c results/issue-121/DYNAMIC-FINAL-SHA256SUMS \
            | tee archival-output/detached-tag-checksums.txt

      - name: Verify Software Heritage request and snapshot contents
        run: |
          set -euo pipefail
          mkdir -p archival-output
          request_url='https://archive.softwareheritage.org/api/1/origin/save/2399784/'
          curl -fsS -H 'Accept: application/json' "$request_url" \
            > archival-output/swh-status.json

          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.request import Request, urlopen

          publication_commit = '4dfb0b961470974f9dc80a936db86450303d007a'
          research_tag = 'refs/tags/research-closeout-issue-121'

          status = json.loads(Path('archival-output/swh-status.json').read_text())
          assert status['id'] == 2399784
          assert status['origin_url'] == 'https://github.com/kodlbegiko/research-readme-smoketest'
          assert status['save_request_status'] == 'accepted'
          assert status['save_task_status'] == 'succeeded'
          assert status['visit_status'] == 'full'
          assert status['snapshot_swhid'].startswith('swh:1:snp:')

          req = Request(status['snapshot_url'], headers={'Accept': 'application/json'})
          with urlopen(req) as response:
              snapshot = json.load(response)
          Path('archival-output/swh-snapshot.json').write_text(
              json.dumps(snapshot, indent=2, ensure_ascii=False) + '\n'
          )

          branches = snapshot['branches']
          assert research_tag in branches, sorted(branches)
          branch = branches[research_tag]
          trace = [{'name': research_tag, **branch}]

          if branch['target_type'] == 'release':
              req = Request(branch['target_url'], headers={'Accept': 'application/json'})
              with urlopen(req) as response:
                  release = json.load(response)
              Path('archival-output/swh-tag-release.json').write_text(
                  json.dumps(release, indent=2, ensure_ascii=False) + '\n'
              trace.append({'release': release})
              assert release['target_type'] == 'revision'
              assert release['target'] == publication_commit
          elif branch['target_type'] == 'revision':
              assert branch['target'] == publication_commit
          else:
              raise AssertionError(f"Unexpected tag target type: {branch['target_type']}")

          verification = {
              'request_id': status['id'],
              'request_url': status['request_url'],
              'save_request_status': status['save_request_status'],
              'save_task_status': status['save_task_status'],
              'visit_status': status['visit_status'],
              'visit_date': status['visit_date'],
              'snapshot_swhid': status['snapshot_swhid'],
              'snapshot_url': status['snapshot_url'],
              'research_tag': research_tag,
              'publication_commit': publication_commit,
              'tag_trace': trace,
              'verified': True,
          }
          Path('archival-output/swh-verification.json').write_text(
              json.dumps(verification, indent=2, ensure_ascii=False) + '\n'
          )
          PY

      - name: Produce archival summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          out = Path('archival-output')
          def load_json(name):
              path = out / name
              if not path.exists():
                  return None
              try:
                  return json.loads(path.read_text())
              except Exception:
                  return {'raw': path.read_text(errors='replace')}

          summary = {
              'tag_verification': (out / 'tag-verification.txt').read_text(errors='replace')
                  if (out / 'tag-verification.txt').exists() else None,
              'release': load_json('release-summary.json'),
              'checksums': (out / 'detached-tag-checksums.txt').read_text(errors='replace')
                  if (out / 'detached-tag-checksums.txt').exists() else None,
              'software_heritage': load_json('swh-verification.json'),
          }
          (out / 'summary.json').write_text(
              json.dumps(summary, indent=2, ensure_ascii=False) + '\n'
          )
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: archival-verification-output
          path: archival-output
          if-no-files-found: error
