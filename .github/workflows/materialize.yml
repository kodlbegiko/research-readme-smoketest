name: Materialize research bundle

on:
  push:
    branches:
      - research/joss-122-pilot
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Decode and verify deterministic bundle
        shell: bash
        run: |
          cat .bootstrap/bundle.part.* | base64 --decode > /tmp/research-readme-smoketest.tar.gz
          echo "9d49138e33b5ec0be6f924cf2f67b6c6b0fa9e7f547ced7528b2b1d1c20916b9  /tmp/research-readme-smoketest.tar.gz" | sha256sum --check --strict

      - name: Materialize non-workflow repository contents
        shell: bash
        run: |
          tar -xzf /tmp/research-readme-smoketest.tar.gz -C . --exclude='./.github/workflows/ci.yml'
          rm -rf .bootstrap

      - name: Attempt materialization commit
        id: commit
        shell: bash
        run: |
          set +e
          {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git status --short
            git add -A
            git status --short
            if git diff --cached --quiet; then
              echo "No materialization changes to commit."
              exit 0
            fi
            git commit -m "feat: publish reproducible JOSS README pilot" || exit $?
            git push origin "HEAD:${{ github.head_ref || github.ref_name }}"
          } 2>&1 | tee /tmp/materialize-debug.log
          status=${PIPESTATUS[0]}
          echo "$status" > /tmp/materialize-exit-code
          exit 0

      - name: Upload materialization diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: materialize-diagnostics
          path: |
            /tmp/materialize-debug.log
            /tmp/materialize-exit-code

      - name: Propagate materialization failure
        shell: bash
        run: exit "$(cat /tmp/materialize-exit-code)"
