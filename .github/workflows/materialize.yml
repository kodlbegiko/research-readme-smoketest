name: Materialize research bundle

on:
  push:
    branches:
      - research/joss-122-pilot

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and verify deterministic bundle
        shell: bash
        run: |
          cat .bootstrap/bundle.part.* | base64 --decode > /tmp/research-readme-smoketest.tar.gz
          echo "9d49138e33b5ec0be6f924cf2f67b6c6b0fa9e7f547ced7528b2b1d1c20916b9  /tmp/research-readme-smoketest.tar.gz" | sha256sum --check --strict

      - name: Materialize repository contents
        shell: bash
        run: |
          tar -xzf /tmp/research-readme-smoketest.tar.gz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/materialize.yml

      - name: Commit materialized research project
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No materialization changes to commit."
            exit 0
          fi
          git commit -m "feat: publish reproducible JOSS README pilot"
          git push origin "HEAD:${GITHUB_REF_NAME}"
