name: Temporary Ruff format diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  format-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Generate Ruff formatting patch
        run: |
          ruff format .
          git diff --binary > /tmp/ruff-format.patch
          test -s /tmp/ruff-format.patch
      - name: Upload formatting patch
        uses: actions/upload-artifact@v4
        with:
          name: ruff-format-patch
          path: /tmp/ruff-format.patch
          if-no-files-found: error
          retention-days: 1
