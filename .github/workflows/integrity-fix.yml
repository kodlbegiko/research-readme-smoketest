name: Apply research integrity fixes

on:
  pull_request:
    paths:
      - ".github/workflows/integrity-fix.yml"
      - "scripts/apply_integrity_fixes.py"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Apply bounded integrity patches
        run: |
          python scripts/apply_integrity_fixes.py
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/run_dynamic_case.py')
          text = path.read_text()
          start = text.index('        stderr += (', text.index('except subprocess.TimeoutExpired:'))
          end = text.index('    duration = time.perf_counter() - started', start)
          replacement = '''        stderr += (\n            f"\\nTIMEOUT after {spec.timeout_seconds} seconds; "\n            "process group terminated\\n"\n        )\n'''
          path.write_text(text[:start] + replacement + text[end:])

          path = Path('tests/test_dynamic_harness.py')
          text = path.read_text()
          start = text.index(
              '    command = (',
              text.index('def test_timeout_terminates_descendant_process_group'),
          )
          end = text.index('    result = module.run_step(', start)
          replacement = '''    command = (\n        "python - <<'PY'\\n"\n        "import pathlib, subprocess, time\\n"\n        "p = subprocess.Popen(['sleep', '30'])\\n"\n        "pathlib.Path('child.pid').write_text(str(p.pid))\\n"\n        "time.sleep(30)\\n"\n        "PY"\n    )\n'''
          path.write_text(text[:start] + replacement + text[end:])
          PY
          rm scripts/apply_integrity_fixes.py
      - name: Install tools
        run: python -m pip install -e ".[dev]"
      - name: Parse patched files
        run: |
          python -m py_compile scripts/run_dynamic_case.py scripts/evaluate_issue_121.py \
            scripts/acquire_issue_121.py tests/test_dynamic_harness.py \
            tests/test_issue121_reference.py tests/test_issue121_pipeline.py
      - name: Format patched files
        run: |
          ruff check scripts/run_dynamic_case.py scripts/evaluate_issue_121.py \
            scripts/acquire_issue_121.py tests/test_dynamic_harness.py \
            tests/test_issue121_reference.py tests/test_issue121_pipeline.py --fix || true
          ruff format scripts/run_dynamic_case.py scripts/evaluate_issue_121.py \
            scripts/acquire_issue_121.py tests/test_dynamic_harness.py \
            tests/test_issue121_reference.py tests/test_issue121_pipeline.py
      - name: Check lint and format
        run: |
          ruff check .
          ruff format --check .
      - name: Test timeout and task assertions
        run: pytest -vv tests/test_dynamic_harness.py
      - name: Test prediction lock validation
        run: pytest -vv tests/test_issue121_reference.py
      - name: Test immutable acquisition revision
        run: pytest -vv tests/test_issue121_pipeline.py
      - name: Commit bounded integrity fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/run_dynamic_case.py scripts/evaluate_issue_121.py \
            scripts/acquire_issue_121.py tests/test_dynamic_harness.py \
            tests/test_issue121_reference.py tests/test_issue121_pipeline.py \
            scripts/apply_integrity_fixes.py
          git diff --cached --check
          git commit -m "fix: close research integrity review findings"
          git push origin HEAD:${{ github.head_ref }}
