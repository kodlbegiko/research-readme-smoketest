name: Apply research integrity fixes

on:
  pull_request:
    paths:
      - ".github/workflows/integrity-fix.yml"
      - "scripts/apply_integrity_fixes.py"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Apply bounded integrity patches
        run: python scripts/apply_integrity_fixes.py
      - name: Validate patch
        run: |
          python -m pip install -e ".[dev]"
          ruff check scripts/run_dynamic_case.py scripts/evaluate_issue_121.py \
            scripts/acquire_issue_121.py tests/test_dynamic_harness.py \
            tests/test_issue121_reference.py tests/test_issue121_pipeline.py --fix
          ruff format scripts/run_dynamic_case.py scripts/evaluate_issue_121.py \
            scripts/acquire_issue_121.py tests/test_dynamic_harness.py \
            tests/test_issue121_reference.py tests/test_issue121_pipeline.py
          ruff check .
          ruff format --check .
          pytest tests/test_dynamic_harness.py tests/test_issue121_reference.py \
            tests/test_issue121_pipeline.py
      - name: Commit bounded integrity fixes
        run: |
          rm scripts/apply_integrity_fixes.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/run_dynamic_case.py scripts/evaluate_issue_121.py \
            scripts/acquire_issue_121.py tests/test_dynamic_harness.py \
            tests/test_issue121_reference.py tests/test_issue121_pipeline.py \
            scripts/apply_integrity_fixes.py
          git diff --cached --check
          git commit -m "fix: close research integrity review findings"
          git push origin HEAD:${{ github.head_ref }}
