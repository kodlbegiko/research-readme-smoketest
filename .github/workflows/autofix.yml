name: One-shot Ruff autofix

on:
  push:
    branches:
      - research/joss-122-pilot

permissions:
  contents: write

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/joss-122-pilot
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install exact formatter
        run: python -m pip install 'ruff==0.12.5'
      - name: Apply lint and format fixes
        run: |
          ruff check --fix .
          ruff format .
      - name: Commit source-only fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.py'
          if git diff --cached --quiet; then
            echo "No source formatting changes."
            exit 0
          fi
          git commit -m "style: apply Ruff autofixes"
          git push origin HEAD:research/joss-122-pilot
