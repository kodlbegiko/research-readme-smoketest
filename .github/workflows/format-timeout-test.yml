name: Format timeout regression test

on:
  pull_request:
    paths:
      - ".github/workflows/format-timeout-test.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install formatter
        run: python -m pip install -e ".[dev]"
      - name: Format and verify target
        run: |
          ruff format tests/test_dynamic_harness.py
          ruff check tests/test_dynamic_harness.py
          ruff format --check tests/test_dynamic_harness.py
          pytest tests/test_dynamic_harness.py
      - name: Commit only the formatted test
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_dynamic_harness.py
          git diff --cached --check
          git commit -m "style: apply Ruff formatting to timeout regression test"
          git push origin HEAD:${{ github.head_ref }}
