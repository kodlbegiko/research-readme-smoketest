name: One-shot Zenodo archival package

on:
  push:
    branches:
      - agent/zenodo-manual-package
    paths:
      - .github/workflows/zenodo-manual-package-one-shot.yml
  pull_request:
    paths:
      - .github/workflows/zenodo-manual-package-one-shot.yml

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: research-closeout-issue-121
      PUBLICATION_COMMIT: 4dfb0b961470974f9dc80a936db86450303d007a
      PACKAGE_NAME: research-readme-smoketest-research-closeout-issue-121-zenodo.zip
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Verify formal annotated tag
        run: |
          set -euxo pipefail
          git fetch --force --tags origin
          test "$(git cat-file -t "$TAG")" = 'tag'
          test "$(git rev-parse "$TAG^{}")" = "$PUBLICATION_COMMIT"

      - name: Export tagged source
        run: |
          set -euxo pipefail
          rm -rf zenodo-staging zenodo-output
          mkdir -p zenodo-staging/source zenodo-staging/release-assets zenodo-output
          git archive --format=tar --prefix=research-readme-smoketest-research-closeout-issue-121/ "$TAG^{}" \
            | tar -xf - -C zenodo-staging/source
          find zenodo-staging/source -type f | LC_ALL=C sort > zenodo-output/source-file-list.txt

      - name: Download exact seven Release assets
        run: |
          set -euxo pipefail
          gh release download "$TAG" \
            --repo kodlbegiko/research-readme-smoketest \
            --dir zenodo-staging/release-assets \
            --pattern 'dynamic-validation-results.json' \
            --pattern 'dynamic-validation-results.csv' \
            --pattern 'intervention-log.json' \
            --pattern 'intervention-log.csv' \
            --pattern 'DYNAMIC-FINAL-SHA256SUMS' \
            --pattern 'research-manifest-issue-121.yml' \
            --pattern 'EXTERNAL-VALIDATION.md'
          find zenodo-staging/release-assets -maxdepth 1 -type f -printf '%f\n' \
            | LC_ALL=C sort | tee zenodo-output/release-asset-list.txt
          sha256sum zenodo-staging/release-assets/* \
            | tee zenodo-output/release-assets-SHA256SUMS

      - name: Record Release assets versus tagged source
        run: |
          set -euxo pipefail
          python - <<'PY' | tee zenodo-output/release-source-comparison.txt
          from pathlib import Path
          import hashlib
          import difflib

          root = Path('zenodo-staging/source/research-readme-smoketest-research-closeout-issue-121')
          assets = Path('zenodo-staging/release-assets')
          mapping = {
              'dynamic-validation-results.json': root / 'results/issue-121/dynamic-validation-results.json',
              'dynamic-validation-results.csv': root / 'results/issue-121/dynamic-validation-results.csv',
              'intervention-log.json': root / 'results/issue-121/intervention-log.json',
              'intervention-log.csv': root / 'results/issue-121/intervention-log.csv',
              'DYNAMIC-FINAL-SHA256SUMS': root / 'results/issue-121/DYNAMIC-FINAL-SHA256SUMS',
              'research-manifest-issue-121.yml': root / 'research-manifest-issue-121.yml',
              'EXTERNAL-VALIDATION.md': root / 'EXTERNAL-VALIDATION.md',
          }
          actual = {p.name for p in assets.iterdir() if p.is_file()}
          expected = set(mapping)
          assert actual == expected, {'actual': sorted(actual), 'expected': sorted(expected)}
          mismatches = []
          lines = []
          for name, source in mapping.items():
              assert source.exists(), source
              release_bytes = (assets / name).read_bytes()
              source_bytes = source.read_bytes()
              release_sha = hashlib.sha256(release_bytes).hexdigest()
              source_sha = hashlib.sha256(source_bytes).hexdigest()
              equal = release_bytes == source_bytes
              lines.append(f'{name}: release={release_sha} source={source_sha} equal={equal}')
              if not equal:
                  mismatches.append(name)
                  try:
                      rel_text = release_bytes.decode('utf-8').splitlines(keepends=True)
                      src_text = source_bytes.decode('utf-8').splitlines(keepends=True)
                  except UnicodeDecodeError:
                      continue
                  diff = ''.join(difflib.unified_diff(
                      src_text,
                      rel_text,
                      fromfile=f'tag/{name}',
                      tofile=f'release/{name}',
                  ))
                  Path(f'zenodo-output/diff-{name}.patch').write_text(diff, encoding='utf-8')
          lines.append('mismatches=' + ','.join(mismatches))
          report = '\n'.join(lines) + '\n'
          print(report, end='')
          Path('zenodo-staging/RELEASE-SOURCE-COMPARISON.txt').write_text(report, encoding='utf-8')
          PY

      - name: Build deterministic single ZIP
        run: |
          set -euxo pipefail
          cat > zenodo-staging/ARCHIVAL-METADATA.txt <<'EOF'
          Title: Issue 121 External Validation — Negative Research Closeout
          Repository: https://github.com/kodlbegiko/research-readme-smoketest
          Formal tag: research-closeout-issue-121
          Publication commit: 4dfb0b961470974f9dc80a936db86450303d007a
          GitHub Release: https://github.com/kodlbegiko/research-readme-smoketest/releases/tag/research-closeout-issue-121
          Software Heritage snapshot: swh:1:snp:ece8d8c66053310b42035491d500d0647b3caccc
          Package policy: preserves both the formal tagged source and the exact frozen Release assets; any byte differences are disclosed in RELEASE-SOURCE-COMPARISON.txt.
          Research result: NEGATIVE RESULT PRESERVED
          Product status: NOT A PRODUCT
          GitHub Action v0.2: NOT CREATED AND NOT PLANNED
          EOF

          find zenodo-staging -exec touch -t 202607260000.00 {} +
          (
            cd zenodo-staging
            find . -type f ! -name PACKAGE-SHA256SUMS -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 sha256sum > PACKAGE-SHA256SUMS
          )
          touch -t 202607260000.00 zenodo-staging/PACKAGE-SHA256SUMS
          (
            cd zenodo-staging
            LC_ALL=C find . -print | LC_ALL=C sort | zip -X -q -9 -@ "../zenodo-output/$PACKAGE_NAME"
          )
          sha256sum "zenodo-output/$PACKAGE_NAME" | tee zenodo-output/SHA256SUMS
          unzip -t "zenodo-output/$PACKAGE_NAME" | tee zenodo-output/zip-test.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zenodo-manual-upload-package
          path: zenodo-output
          if-no-files-found: error
