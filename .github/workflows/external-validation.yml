name: Issue 121 external validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/acquire_issue_121.py"
      - "data/issue-121/sampling-frame.json"
      - "src/readme_smoketest/**"
      - "tests/test_issue121_pipeline.py"
      - ".github/workflows/external-validation.yml"

permissions:
  contents: write

jobs:
  acquire-and-predict:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install frozen package and test tools
        run: python -m pip install -e ".[dev]"
      - name: Check acquisition implementation only
        run: |
          ruff check scripts/acquire_issue_121.py tests/test_issue121_pipeline.py
          ruff format --check scripts/acquire_issue_121.py tests/test_issue121_pipeline.py
      - name: Validate acquisition unit tests
        run: pytest tests/test_issue121_pipeline.py
      - name: Run frozen acquisition and prediction
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/acquire_issue_121.py --output-dir /tmp/issue-121
      - name: Verify prediction determinism from acquired records
        run: |
          mkdir -p /tmp/hash-seed-0 /tmp/hash-seed-321
          PYTHONHASHSEED=0 python - <<'PY'
          import json
          from pathlib import Path
          from readme_smoketest.analyze import analyze_records
          from readme_smoketest.model import Record
          source = json.loads(Path('/tmp/issue-121/raw/source-records.json').read_text())
          output = analyze_records([Record.from_dict(item) for item in source])
          Path('/tmp/hash-seed-0/recomputed.json').write_text(
              json.dumps(output, ensure_ascii=False, indent=2, sort_keys=True) + '\n'
          )
          PY
          PYTHONHASHSEED=321 python - <<'PY'
          import json
          from pathlib import Path
          from readme_smoketest.analyze import analyze_records
          from readme_smoketest.model import Record
          source = json.loads(Path('/tmp/issue-121/raw/source-records.json').read_text())
          output = analyze_records([Record.from_dict(item) for item in source])
          Path('/tmp/hash-seed-321/recomputed.json').write_text(
              json.dumps(output, ensure_ascii=False, indent=2, sort_keys=True) + '\n'
          )
          PY
          diff -u /tmp/hash-seed-0/recomputed.json /tmp/hash-seed-321/recomputed.json
          diff -u /tmp/issue-121/predictions/predictions.json /tmp/hash-seed-0/recomputed.json
      - name: Verify committed prediction lock
        run: |
          test -f data/issue-121/predictions/PREDICTION_LOCK.json
          diff -u \
            data/issue-121/predictions/predictions.json \
            /tmp/issue-121/predictions/predictions.json
          test "$(sha256sum /tmp/issue-121/predictions/predictions.json | cut -d' ' -f1)" = \
            "028437d2203fb4d4bd417362618c7d55069dc40f177e28eb646eef8484ca19c1"
      - name: Upload prediction-lock bundle
        uses: actions/upload-artifact@v4
        with:
          name: issue-121-prediction-lock
          path: /tmp/issue-121/
          if-no-files-found: error
          retention-days: 90
