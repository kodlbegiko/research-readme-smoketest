name: Issue 121 external validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/acquire_issue_121.py"
      - "scripts/evaluate_issue_121.py"
      - "data/issue-121/**"
      - "src/readme_smoketest/**"
      - "tests/test_issue121_pipeline.py"
      - "tests/test_issue121_reference.py"
      - ".github/workflows/external-validation.yml"

permissions:
  contents: read

jobs:
  acquire-predict-and-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install frozen package and test tools
        run: python -m pip install -e ".[dev]"
      - name: Check study code and tests
        run: |
          ruff check scripts/acquire_issue_121.py scripts/evaluate_issue_121.py \
            tests/test_issue121_pipeline.py tests/test_issue121_reference.py
          ruff format --check scripts/acquire_issue_121.py scripts/evaluate_issue_121.py \
            tests/test_issue121_pipeline.py tests/test_issue121_reference.py
          pytest tests/test_issue121_pipeline.py tests/test_issue121_reference.py
      - name: Reacquire outside the checkout and verify frozen predictions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/issue-121
          python scripts/acquire_issue_121.py --output-dir /tmp/issue-121
          diff -u \
            data/issue-121/predictions/predictions.json \
            /tmp/issue-121/predictions/predictions.json
          test "$(sha256sum /tmp/issue-121/predictions/predictions.json | cut -d' ' -f1)" = \
            "028437d2203fb4d4bd417362618c7d55069dc40f177e28eb646eef8484ca19c1"
      - name: Reproduce reference evaluation outside the checkout
        run: |
          python scripts/evaluate_issue_121.py \
            --data-dir /tmp/issue-121 \
            --results-dir /tmp/issue-121-results
          diff -u \
            data/issue-121/annotations/reference-labels.json \
            /tmp/issue-121/annotations/reference-labels.json
          diff -u \
            results/issue-121/static-validation-results.json \
            /tmp/issue-121-results/static-validation-results.json
      - name: Upload read-only validation bundle
        uses: actions/upload-artifact@v4
        with:
          name: issue-121-external-validation-reproduction
          path: |
            /tmp/issue-121/
            /tmp/issue-121-results/
          if-no-files-found: error
          retention-days: 30
