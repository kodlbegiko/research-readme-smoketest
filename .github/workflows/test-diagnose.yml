name: Diagnose Python 3.13 tests

on:
  pull_request:
    paths:
      - ".github/workflows/test-diagnose.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Run tests with complete diagnostics
        shell: bash
        run: |
          set -o pipefail
          pytest -vv --junitxml=/tmp/pytest-313.xml 2>&1 | tee /tmp/pytest-313.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-313-diagnostics
          path: |
            /tmp/pytest-313.xml
            /tmp/pytest-313.log
          if-no-files-found: warn
          retention-days: 7
