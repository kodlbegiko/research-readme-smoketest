name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install formatting toolchain
        run: python -m pip install -e ".[dev]"
      - name: Apply deterministic Ruff fixes
        run: |
          ruff check . --fix --unsafe-fixes || true
          ruff format .
      - name: Persist PR formatting changes
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: apply deterministic Ruff formatting"
          git push origin HEAD:${{ github.head_ref }}

  quality:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Type check
        run: mypy src
      - name: Test
        run: pytest
      - name: Coverage
        run: pytest --cov --cov-report=term-missing --cov-fail-under=90
      - name: Build distributions
        run: python -m build
      - name: Reproduce published result
        run: |
          PYTHONHASHSEED=0 readme-smoketest pilot --output-dir /tmp/readme-a
          PYTHONHASHSEED=321 readme-smoketest pilot --output-dir /tmp/readme-b
          diff -u /tmp/readme-a/pilot-results.json /tmp/readme-b/pilot-results.json
          diff -u /tmp/readme-a/pilot-results.csv /tmp/readme-b/pilot-results.csv
          test "$(sha256sum /tmp/readme-a/pilot-results.json | cut -d' ' -f1)" = "531f145706238996c499746bdb46c9f4d281221828b4f07691c68782ca2f80f8"
      - name: Upload reproduced outputs
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: reproduced-results
          path: /tmp/readme-a/

  reference-evaluation:
    needs: quality
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Freeze annotation completion timestamp
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/evaluate_issue_121.py')
          text = path.read_text()
          text = text.replace(
              'datetime.now(UTC).replace(microsecond=0).isoformat()',
              '"2026-07-25T14:31:06Z"',
          )
          path.write_text(text)
          PY
          ruff check scripts/evaluate_issue_121.py tests/test_issue121_reference.py --fix
          ruff format scripts/evaluate_issue_121.py tests/test_issue121_reference.py
      - name: Verify prediction lock precedes annotations
        run: |
          test -f data/issue-121/predictions/PREDICTION_LOCK.json
          test ! -e data/issue-121/annotations/reference-labels.json
          test "$(sha256sum data/issue-121/predictions/predictions.json | cut -d' ' -f1)" = \
            "028437d2203fb4d4bd417362618c7d55069dc40f177e28eb646eef8484ca19c1"
      - name: Generate reference annotations and metrics
        run: |
          pytest tests/test_issue121_reference.py tests/test_issue121_pipeline.py
          python scripts/evaluate_issue_121.py
      - name: Verify deterministic reference results
        run: |
          rm -rf /tmp/reference-a /tmp/reference-b
          mkdir -p /tmp/reference-a/data/issue-121 /tmp/reference-b/data/issue-121
          cp -R data/issue-121/raw /tmp/reference-a/data/issue-121/
          cp -R data/issue-121/raw /tmp/reference-b/data/issue-121/
          cp -R data/issue-121/predictions /tmp/reference-a/data/issue-121/
          cp -R data/issue-121/predictions /tmp/reference-b/data/issue-121/
          PYTHONHASHSEED=0 python scripts/evaluate_issue_121.py \
            --data-dir /tmp/reference-a/data/issue-121 \
            --results-dir /tmp/reference-a/results >/dev/null
          PYTHONHASHSEED=321 python scripts/evaluate_issue_121.py \
            --data-dir /tmp/reference-b/data/issue-121 \
            --results-dir /tmp/reference-b/results >/dev/null
          diff -u \
            /tmp/reference-a/data/issue-121/annotations/reference-labels.json \
            /tmp/reference-b/data/issue-121/annotations/reference-labels.json
          diff -u \
            /tmp/reference-a/results/static-validation-results.json \
            /tmp/reference-b/results/static-validation-results.json
          diff -u \
            /tmp/reference-a/results/ecosystem-stratification.csv \
            /tmp/reference-b/results/ecosystem-stratification.csv
          diff -u \
            /tmp/reference-a/results/readme-length-sensitivity.csv \
            /tmp/reference-b/results/readme-length-sensitivity.csv
      - name: Commit reference lock and results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/evaluate_issue_121.py tests/test_issue121_reference.py \
            data/issue-121/annotations results/issue-121
          git commit -m "research: lock issue 121 reference evaluation"
          git push origin HEAD:${{ github.head_ref }}
      - name: Upload static validation bundle
        uses: actions/upload-artifact@v4
        with:
          name: issue-121-static-validation
          path: |
            data/issue-121/annotations/
            results/issue-121/
          if-no-files-found: error
          retention-days: 90
