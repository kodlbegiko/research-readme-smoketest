name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  finalize-closeout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          show-progress: false
      - name: Restore, validate, and commit research files
        shell: bash
        run: |
          set -euo pipefail
          cat .closeout-final.part-* | base64 --decode > /tmp/closeout-final.tar.xz
          test "$(sha256sum /tmp/closeout-final.tar.xz | cut -d' ' -f1)" = \
            "0b1777fdf66627ccdcce28cd0af73df603781f07c7b4f8e6217a104b3fb49862"
          tar -xJf /tmp/closeout-final.tar.xz -C .
          git checkout HEAD -- .github/workflows/ci.yml .github/workflows/finalize-closeout.yml
          rm -f .closeout-final.part-* scripts/run_closeout_checks.py
          sha256sum --check results/issue-121/DYNAMIC-FINAL-SHA256SUMS >/dev/null
          test -f EXTERNAL-VALIDATION.md
          test -f results/issue-121/dynamic-validation-results.json
          test -f results/interventions/intervention-log.json
          test -f data/issue-121/dynamic-tests/adjudications/adjudications.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "research: add issue 121 final adjudication and evidence"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
