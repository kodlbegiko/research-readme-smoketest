name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install formatting toolchain
        run: python -m pip install -e ".[dev]"
      - name: Apply deterministic Ruff fixes
        run: |
          ruff check . --fix --unsafe-fixes || true
          ruff format .
      - name: Persist PR formatting changes
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: apply deterministic Ruff formatting"
          git push origin HEAD:${{ github.head_ref }}

  quality:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Capture Ruff diagnostics
        if: matrix.python-version == '3.13'
        run: ruff check . --output-format=json > /tmp/ruff-diagnostics.json || true
      - name: Upload Ruff diagnostics
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-lock-ruff-diagnostics
          path: /tmp/ruff-diagnostics.json
          if-no-files-found: error
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Type check
        run: mypy src
      - name: Test
        run: pytest
      - name: Coverage
        run: pytest --cov --cov-report=term-missing --cov-fail-under=90
      - name: Build distributions
        run: python -m build
      - name: Reproduce published pilot
        run: |
          PYTHONHASHSEED=0 readme-smoketest pilot --output-dir /tmp/readme-a
          PYTHONHASHSEED=321 readme-smoketest pilot --output-dir /tmp/readme-b
          diff -u /tmp/readme-a/pilot-results.json /tmp/readme-b/pilot-results.json
          diff -u /tmp/readme-a/pilot-results.csv /tmp/readme-b/pilot-results.csv
          test "$(sha256sum /tmp/readme-a/pilot-results.json | cut -d' ' -f1)" = \
            "531f145706238996c499746bdb46c9f4d281221828b4f07691c68782ca2f80f8"
      - name: Upload reproduced outputs
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: reproduced-results
          path: /tmp/readme-a/

  static-verification:
    needs: quality
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Verify frozen hashes and reference result
        run: |
          test "$(sha256sum data/issue-121/predictions/predictions.json | cut -d' ' -f1)" = \
            "028437d2203fb4d4bd417362618c7d55069dc40f177e28eb646eef8484ca19c1"
          test "$(sha256sum data/issue-121/annotations/reference-labels.json | cut -d' ' -f1)" = \
            "602d6b9a794b93ff3ea823d579917f9dc62530431534b019fed9916d21a74724"
          test "$(sha256sum results/issue-121/static-validation-results.json | cut -d' ' -f1)" = \
            "400c404de5338cff630f6147f18288b5b557341a6fb11d3da56b956c13b5f316"
          pytest tests/test_issue121_reference.py tests/test_issue121_pipeline.py
      - name: Reproduce reference result outside the committed directories
        run: |
          mkdir -p /tmp/reference/data/issue-121
          cp -R data/issue-121/raw /tmp/reference/data/issue-121/
          cp -R data/issue-121/predictions /tmp/reference/data/issue-121/
          python scripts/evaluate_issue_121.py \
            --data-dir /tmp/reference/data/issue-121 \
            --results-dir /tmp/reference/results >/dev/null
          diff -u \
            data/issue-121/annotations/reference-labels.json \
            /tmp/reference/data/issue-121/annotations/reference-labels.json
          diff -u \
            results/issue-121/static-validation-results.json \
            /tmp/reference/results/static-validation-results.json

  dynamic-lock:
    needs: static-verification
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Create or verify pre-execution dynamic lock
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          if test -f data/issue-121/dynamic-tests/DYNAMIC_LOCK.json; then
            python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          manifest = Path('data/issue-121/dynamic-tests/case-manifest.json')
          lock = json.loads(Path('data/issue-121/dynamic-tests/DYNAMIC_LOCK.json').read_text())
          digest = hashlib.sha256(manifest.read_bytes()).hexdigest()
          assert digest == lock['manifest_sha256']
          assert lock['selected_count'] == 10
          assert lock['execution_results_present_when_locked'] is False
          PY
            exit 0
          fi
          python scripts/lock_dynamic_cases.py
          test ! -d data/issue-121/dynamic-tests/results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/lock_dynamic_cases.py data/issue-121/dynamic-tests
          git commit -m "research: lock dynamic validation cases"
          git push origin HEAD:${{ github.head_ref }}
      - name: Upload dynamic lock
        uses: actions/upload-artifact@v4
        with:
          name: issue-121-dynamic-lock
          path: data/issue-121/dynamic-tests/
          if-no-files-found: error
          retention-days: 90
