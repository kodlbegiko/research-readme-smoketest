name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  finalize-closeout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore verified final tree
        shell: bash
        run: |
          set -euo pipefail
          cat .closeout-final.part-* | base64 --decode > /tmp/closeout-final.tar.xz
          echo "0b1777fdf66627ccdcce28cd0af73df603781f07c7b4f8e6217a104b3fb49862  /tmp/closeout-final.tar.xz" | sha256sum --check
          tar -xJf /tmp/closeout-final.tar.xz -C .
          rm -f .closeout-final.part-* .github/workflows/finalize-closeout.yml scripts/run_closeout_checks.py
          sha256sum --check results/issue-121/DYNAMIC-FINAL-SHA256SUMS
          test -f EXTERNAL-VALIDATION.md
          test -f results/issue-121/dynamic-validation-results.json
          test -f results/interventions/intervention-log.json
      - name: Commit final closeout tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "research: finalize issue 121 external validation closeout"
          git push origin HEAD:${GITHUB_HEAD_REF}
