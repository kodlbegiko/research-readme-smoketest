name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install formatting toolchain
        run: python -m pip install -e ".[dev]"
      - name: Apply deterministic Ruff fixes
        run: |
          ruff check . --fix --unsafe-fixes || true
          ruff format .
      - name: Persist PR formatting changes
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: format dynamic validation harness"
          git push origin HEAD:${{ github.head_ref }}

  quality:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Capture Ruff diagnostics
        if: matrix.python-version == '3.13'
        run: ruff check . --output-format=json > /tmp/dynamic-harness-ruff.json || true
      - name: Upload Ruff diagnostics
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-harness-ruff-diagnostics
          path: /tmp/dynamic-harness-ruff.json
          if-no-files-found: error
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Type check
        run: mypy src
      - name: Test
        run: pytest
      - name: Coverage
        run: pytest --cov --cov-report=term-missing --cov-fail-under=90
      - name: Build distributions
        run: python -m build
      - name: Reproduce published pilot
        run: |
          PYTHONHASHSEED=0 readme-smoketest pilot --output-dir /tmp/readme-a
          PYTHONHASHSEED=321 readme-smoketest pilot --output-dir /tmp/readme-b
          diff -u /tmp/readme-a/pilot-results.json /tmp/readme-b/pilot-results.json
          diff -u /tmp/readme-a/pilot-results.csv /tmp/readme-b/pilot-results.csv
          test "$(sha256sum /tmp/readme-a/pilot-results.json | cut -d' ' -f1)" = \
            "531f145706238996c499746bdb46c9f4d281221828b4f07691c68782ca2f80f8"
      - name: Upload reproduced outputs
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: reproduced-results
          path: /tmp/readme-a/

  static-verification:
    needs: quality
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Verify frozen hashes and reference result
        run: |
          test "$(sha256sum data/issue-121/predictions/predictions.json | cut -d' ' -f1)" = \
            "028437d2203fb4d4bd417362618c7d55069dc40f177e28eb646eef8484ca19c1"
          test "$(sha256sum data/issue-121/annotations/reference-labels.json | cut -d' ' -f1)" = \
            "602d6b9a794b93ff3ea823d579917f9dc62530431534b019fed9916d21a74724"
          test "$(sha256sum results/issue-121/static-validation-results.json | cut -d' ' -f1)" = \
            "400c404de5338cff630f6147f18288b5b557341a6fb11d3da56b956c13b5f316"
          pytest tests/test_issue121_reference.py tests/test_issue121_pipeline.py
      - name: Reproduce reference result outside committed directories
        run: |
          mkdir -p /tmp/reference/data/issue-121
          cp -R data/issue-121/raw /tmp/reference/data/issue-121/
          cp -R data/issue-121/predictions /tmp/reference/data/issue-121/
          python scripts/evaluate_issue_121.py \
            --data-dir /tmp/reference/data/issue-121 \
            --results-dir /tmp/reference/results >/dev/null
          diff -u \
            data/issue-121/annotations/reference-labels.json \
            /tmp/reference/data/issue-121/annotations/reference-labels.json
          diff -u \
            results/issue-121/static-validation-results.json \
            /tmp/reference/results/static-validation-results.json

  dynamic-lock:
    needs: static-verification
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify pre-execution dynamic lock
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          manifest = Path('data/issue-121/dynamic-tests/case-manifest.json')
          lock = json.loads(
              Path('data/issue-121/dynamic-tests/DYNAMIC_LOCK.json').read_text()
          )
          digest = hashlib.sha256(manifest.read_bytes()).hexdigest()
          assert digest == lock['manifest_sha256']
          assert digest == 'e2018faa122fdabbf54babc6bd508eb34d41cd66f9a3fa65e0fee4beb131f3fa'
          assert lock['selected_count'] == 10
          assert lock['execution_results_present_when_locked'] is False
          PY
          pytest tests/test_dynamic_harness.py
      - name: Upload dynamic lock
        uses: actions/upload-artifact@v4
        with:
          name: issue-121-dynamic-lock
          path: data/issue-121/dynamic-tests/
          if-no-files-found: error
          retention-days: 90

  dynamic-execution:
    needs: dynamic-lock
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - case_id: D01-himap
            runtime: python
          - case_id: D02-hlafreq
            runtime: python
          - case_id: D03-woodtapper
            runtime: python
          - case_id: D04-multimodars
            runtime: python
          - case_id: D05-cowfootr
            runtime: r
          - case_id: D06-kigali
            runtime: kigali
          - case_id: D07-gapflow
            runtime: python
          - case_id: D08-sklearn-migrator
            runtime: python
          - case_id: D09-boost-geometry
            runtime: cpp
          - case_id: D10-ecodive
            runtime: r
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: r-lib/actions/setup-r@v2
        if: matrix.runtime == 'r'
        with:
          r-version: 'release'
          use-public-rspm: true
      - uses: actions/setup-java@v4
        if: matrix.runtime == 'kigali'
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        if: matrix.runtime == 'kigali'
        with:
          node-version: '22'
      - name: Run or reuse locked case
        env:
          CASE_ID: ${{ matrix.case_id }}
        run: |
          mkdir -p "/tmp/artifact/$CASE_ID"
          committed="data/issue-121/dynamic-tests/results/$CASE_ID"
          if test -f "$committed/result.json"; then
            cp -R "$committed/." "/tmp/artifact/$CASE_ID/"
          else
            python scripts/run_dynamic_case.py \
              --case-id "$CASE_ID" \
              --output-dir "/tmp/artifact/$CASE_ID"
          fi
          test -f "/tmp/artifact/$CASE_ID/result.json"
      - name: Upload raw case result
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-result-${{ matrix.case_id }}
          path: /tmp/artifact/
          if-no-files-found: error
          retention-days: 90

  dynamic-collect:
    needs: dynamic-execution
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          pattern: dynamic-result-*
          path: /tmp/dynamic
          merge-multiple: true
      - name: Validate and index raw case results
        run: |
          test "$(find /tmp/dynamic -mindepth 2 -maxdepth 2 -name result.json | wc -l)" = "10"
          rm -rf data/issue-121/dynamic-tests/results
          mkdir -p data/issue-121/dynamic-tests/results
          cp -R /tmp/dynamic/. data/issue-121/dynamic-tests/results/
          python scripts/collect_dynamic_results.py
      - name: Commit raw dynamic evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/issue-121/dynamic-tests/results \
            results/issue-121/dynamic-raw-index.json \
            results/issue-121/dynamic-raw-index.csv \
            results/issue-121/DYNAMIC-SHA256SUMS
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "research: record locked dynamic task evidence"
          git push origin HEAD:${{ github.head_ref }}
      - name: Upload combined dynamic evidence
        uses: actions/upload-artifact@v4
        with:
          name: issue-121-dynamic-raw-evidence
          path: |
            data/issue-121/dynamic-tests/results/
            results/issue-121/dynamic-raw-index.json
            results/issue-121/dynamic-raw-index.csv
            results/issue-121/DYNAMIC-SHA256SUMS
          if-no-files-found: error
          retention-days: 90
