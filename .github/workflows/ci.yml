name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install formatting toolchain
        run: python -m pip install -e ".[dev]"
      - name: Apply deterministic study style fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/evaluate_issue_121.py')
          text = path.read_text()
          text = text.replace(
              '    39: "Root README is citation-oriented and routes operational material to project websites/wiki.",\n',
              '    39: (\n'
              '        "Root README is citation-oriented and routes operational material "\n'
              '        "to project websites/wiki."\n'
              '    ),\n',
          )
          path.write_text(text)
          PY
          ruff check . --fix --unsafe-fixes || true
          ruff format .
      - name: Persist PR formatting changes
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: repair final Ruff violation"
          git push origin HEAD:${{ github.head_ref }}

  quality:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Type check
        run: mypy src
      - name: Test
        run: pytest
      - name: Coverage
        run: pytest --cov --cov-report=term-missing --cov-fail-under=90
      - name: Build distributions
        run: python -m build
      - name: Reproduce published result
        run: |
          PYTHONHASHSEED=0 readme-smoketest pilot --output-dir /tmp/readme-a
          PYTHONHASHSEED=321 readme-smoketest pilot --output-dir /tmp/readme-b
          diff -u /tmp/readme-a/pilot-results.json /tmp/readme-b/pilot-results.json
          diff -u /tmp/readme-a/pilot-results.csv /tmp/readme-b/pilot-results.csv
          test "$(sha256sum /tmp/readme-a/pilot-results.json | cut -d' ' -f1)" = "531f145706238996c499746bdb46c9f4d281221828b4f07691c68782ca2f80f8"
      - name: Upload reproduced outputs
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: reproduced-results
          path: /tmp/readme-a/
