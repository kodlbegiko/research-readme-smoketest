name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install formatting toolchain
        run: python -m pip install -e ".[dev]"
      - name: Apply deterministic Ruff fixes
        run: |
          ruff check . --fix --unsafe-fixes || true
          ruff format .
      - name: Persist PR formatting changes
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: apply deterministic Ruff formatting"
          git push origin HEAD:${{ github.head_ref }}

  quality:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Capture Ruff diagnostics
        if: matrix.python-version == '3.13'
        run: ruff check . --output-format=json > /tmp/ruff-diagnostics.json || true
      - name: Upload Ruff diagnostics
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: ruff-diagnostics
          path: /tmp/ruff-diagnostics.json
          if-no-files-found: error
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Type check
        run: mypy src
      - name: Test
        run: pytest
      - name: Coverage
        run: pytest --cov --cov-report=term-missing --cov-fail-under=90
      - name: Build distributions
        run: python -m build
      - name: Reproduce published result
        run: |
          PYTHONHASHSEED=0 readme-smoketest pilot --output-dir /tmp/readme-a
          PYTHONHASHSEED=321 readme-smoketest pilot --output-dir /tmp/readme-b
          diff -u /tmp/readme-a/pilot-results.json /tmp/readme-b/pilot-results.json
          diff -u /tmp/readme-a/pilot-results.csv /tmp/readme-b/pilot-results.csv
          test "$(sha256sum /tmp/readme-a/pilot-results.json | cut -d' ' -f1)" = "531f145706238996c499746bdb46c9f4d281221828b4f07691c68782ca2f80f8"
      - name: Upload reproduced outputs
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: reproduced-results
          path: /tmp/readme-a/
