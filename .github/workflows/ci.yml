name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Type check
        run: mypy src
      - name: Test
        run: pytest
      - name: Coverage
        run: pytest --cov --cov-report=term-missing --cov-fail-under=90
      - name: Build distributions
        run: python -m build
      - name: Reproduce published pilot deterministically
        run: |
          PYTHONHASHSEED=0 readme-smoketest pilot --output-dir /tmp/readme-a
          PYTHONHASHSEED=321 readme-smoketest pilot --output-dir /tmp/readme-b
          diff -u /tmp/readme-a/pilot-results.json /tmp/readme-b/pilot-results.json
          diff -u /tmp/readme-a/pilot-results.csv /tmp/readme-b/pilot-results.csv
          test "$(sha256sum /tmp/readme-a/pilot-results.json | cut -d' ' -f1)" = \
            "531f145706238996c499746bdb46c9f4d281221828b4f07691c68782ca2f80f8"

  frozen-integrity:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Verify frozen prediction, reference, and dynamic locks
        run: |
          test "$(sha256sum data/issue-121/predictions/predictions.json | cut -d' ' -f1)" = \
            "028437d2203fb4d4bd417362618c7d55069dc40f177e28eb646eef8484ca19c1"
          test "$(sha256sum data/issue-121/annotations/reference-labels.json | cut -d' ' -f1)" = \
            "602d6b9a794b93ff3ea823d579917f9dc62530431534b019fed9916d21a74724"
          test "$(sha256sum results/issue-121/static-validation-results.json | cut -d' ' -f1)" = \
            "400c404de5338cff630f6147f18288b5b557341a6fb11d3da56b956c13b5f316"
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          manifest = Path('data/issue-121/dynamic-tests/case-manifest.json')
          lock = json.loads(
              Path('data/issue-121/dynamic-tests/DYNAMIC_LOCK.json').read_text()
          )
          digest = hashlib.sha256(manifest.read_bytes()).hexdigest()
          assert digest == lock['manifest_sha256']
          assert digest == 'e2018faa122fdabbf54babc6bd508eb34d41cd66f9a3fa65e0fee4beb131f3fa'
          assert lock['selected_count'] == 10
          assert lock['execution_results_present_when_locked'] is False
          PY
          pytest tests/test_issue121_reference.py \
            tests/test_issue121_pipeline.py \
            tests/test_dynamic_harness.py

  closeout-evidence:
    needs: frozen-integrity
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Run permitted correction attempts and intervention recheck
        run: |
          python scripts/run_closeout_checks.py --output-dir /tmp/closeout-evidence
          test -f /tmp/closeout-evidence/closeout-summary.json
          test -f /tmp/closeout-evidence/D08-sklearn-migrator/attempt-2-harness-correction/result.json
          test -f /tmp/closeout-evidence/D09-boost-geometry/attempt-2-external-doc-delegation/result.json
          test -f /tmp/closeout-evidence/intervention-rechecks/woodtapper-current/result.json
      - name: Upload compact closeout evidence
        uses: actions/upload-artifact@v4
        with:
          name: issue-121-closeout-evidence
          path: /tmp/closeout-evidence/
          if-no-files-found: error
          retention-days: 90
