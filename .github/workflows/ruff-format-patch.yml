name: Temporary Ruff format patch

on:
  pull_request:
    paths:
      - scripts/validate_impact_log.py
      - .github/workflows/ruff-format-patch.yml

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install Ruff
        run: python -m pip install "ruff==0.12.5"
      - name: Generate format patch
        run: |
          ruff format --diff scripts/validate_impact_log.py > ruff-format.patch || true
          test -s ruff-format.patch
      - uses: actions/upload-artifact@v4
        with:
          name: ruff-format-patch
          path: ruff-format.patch
          if-no-files-found: error
